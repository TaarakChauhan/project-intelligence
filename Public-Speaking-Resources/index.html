<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Public Speaking Resources</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffcf7;
      --line: #e7e0d4;
      --accent: #9a3412;
    }
    * { box-sizing: border-box; }
    .skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: #fff; padding: 0.5rem 0.8rem; z-index: 20; }
    .skip:focus { left: 1rem; top: 1rem; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    header {
      padding: 2rem 1.25rem 1rem;
      max-width: 860px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 0.4rem; font-size: 2rem; letter-spacing: -0.02em; }
    .lede { color: var(--muted); margin: 0; }
    nav.tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.25rem 1rem;
    }
    .tab {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      font: inherit;
      font-size: 0.92rem;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.25rem 1.2rem;
      min-height: 40vh;
    }
    .panel[hidden] { display: none !important; }
    pre, .md {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.86rem;
      margin: 0;
    }
    .md.prose {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      white-space: normal;
    }
    .md.prose h1, .md.prose h2, .md.prose h3 { line-height: 1.25; }
    .md.prose h1 { font-size: 1.6rem; }
    .md.prose h2 { font-size: 1.25rem; margin-top: 1.4rem; }
    .md.prose h3 { font-size: 1.05rem; margin-top: 1.1rem; }
    .md.prose p, .md.prose li { color: var(--ink); }
    .md.prose a { color: var(--accent); }
    .md.prose code {
      background: #f0ebe2;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .md.prose pre {
      background: #1c1917;
      color: #f5f5f4;
      padding: 0.9rem;
      border-radius: 10px;
      overflow: auto;
      white-space: pre;
    }
    .md.prose table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    .md.prose th, .md.prose td { border: 1px solid var(--line); padding: 0.4rem 0.5rem; text-align: left; vertical-align: top; }
    .resource-list { display: grid; gap: 0.75rem; }
    .resource {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.85rem 0.9rem;
      background: #fff;
    }
    .resource h3 { margin: 0 0 0.25rem; font-size: 1.02rem; font-family: Georgia, serif; }
    .resource p { margin: 0.15rem 0; color: var(--muted); font-size: 0.92rem; }
    .meta { font-size: 0.82rem; color: #78716c; }
    .error { color: #9f1239; }
    .files { margin-top: 0.75rem; font-size: 0.92rem; }
    .files a { color: var(--accent); }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <h1>Public Speaking Resources</h1>
    <p class="lede">Books, courses, talks, frameworks, and a 30-day plan — the same library, arranged to read.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Resource views">
    <button type="button" class="tab active" role="tab" id="tab-readme" data-view="readme" aria-selected="true" aria-controls="view-readme">README</button>
    <button type="button" class="tab" role="tab" id="tab-plan" data-view="plan" aria-selected="false" aria-controls="view-plan">30-Day Plan</button>
    <button type="button" class="tab" role="tab" id="tab-category" data-view="category" aria-selected="false" aria-controls="view-category">By Category</button>
    <button type="button" class="tab" role="tab" id="tab-index" data-view="index" aria-selected="false" aria-controls="view-index">Resource Index</button>
    <button type="button" class="tab" role="tab" id="tab-docx" data-view="docx" aria-selected="false" aria-controls="view-docx">Master Guide</button>
  </nav>
  <main id="main">
    <section class="panel" id="view-readme" role="tabpanel" aria-labelledby="tab-readme"><div class="md prose" id="readme-body">Loading…</div></section>
    <section class="panel" id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden><div class="md prose" id="plan-body">Loading…</div></section>
    <section class="panel" id="view-category" role="tabpanel" aria-labelledby="tab-category" hidden><div class="md prose" id="category-body">Loading…</div></section>
    <section class="panel" id="view-index" role="tabpanel" aria-labelledby="tab-index" hidden><div id="index-body">Loading…</div></section>
    <section class="panel" id="view-docx" role="tabpanel" aria-labelledby="tab-docx" hidden>
      <p>The master guide is a Word document you can download and keep:</p>
      <p><a href="Public-Speaking-Master-Guide.docx">Download the Public Speaking Master Guide</a></p>
    </section>
  </main>
  <script>
    // Minimal markdown → HTML (enough for this library). Does not alter source files.
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function renderMarkdown(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let inList = false;
      let inCode = false;
      let inTable = false;
      let codeBuf = [];
      function closeList() {
        if (inList) { html += "</ul>"; inList = false; }
      }
      function closeTable() {
        if (inTable) { html += "</tbody></table>"; inTable = false; }
      }
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith("```")) {
          if (inCode) {
            html += "<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>";
            codeBuf = [];
            inCode = false;
          } else {
            closeList(); closeTable();
            inCode = true;
          }
          continue;
        }
        if (inCode) { codeBuf.push(line); continue; }
        if (/^\|/.test(line)) {
          closeList();
          const cells = line.split("|").slice(1, -1).map((c) => c.trim());
          if (/^\|?\s*-+/.test(line.replace(/\|/g, "|"))) continue;
          if (!inTable) {
            html += "<table><thead><tr>" + cells.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
            inTable = true;
            // next separator line likely; continue
            continue;
          }
          html += "<tr>" + cells.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>";
          continue;
        } else {
          closeTable();
        }
        if (/^### /.test(line)) { closeList(); html += "<h3>" + inline(line.slice(4)) + "</h3>"; continue; }
        if (/^## /.test(line)) { closeList(); html += "<h2>" + inline(line.slice(3)) + "</h2>"; continue; }
        if (/^# /.test(line)) { closeList(); html += "<h1>" + inline(line.slice(2)) + "</h1>"; continue; }
        if (/^[-*] /.test(line)) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + inline(line.slice(2)) + "</li>";
          continue;
        }
        if (line.trim() === "") { closeList(); continue; }
        closeList();
        html += "<p>" + inline(line) + "</p>";
      }
      closeList(); closeTable();
      if (inCode) html += "<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>";
      return html;
    }
    function inline(text) {
      let s = escapeHtml(text);
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      return s;
    }

    async function loadText(path, el) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error(res.status + " " + path);
        const text = await res.text();
        el.innerHTML = renderMarkdown(text);
      } catch (err) {
        el.innerHTML = '<p class="error">Could not load ' + path + '. Open this folder through the Project Intelligence local server.</p>';
      }
    }

    async function loadIndex() {
      const el = document.getElementById("index-body");
      try {
        const res = await fetch("resources-index.json");
        if (!res.ok) throw new Error("bad status");
        const data = await res.json();
        const items = Array.isArray(data) ? data : (data.resources || data.items || []);
        if (!items.length) {
          el.innerHTML = "<pre class='md'>" + escapeHtml(JSON.stringify(data, null, 2)) + "</pre>";
          return;
        }
        el.innerHTML = '<div class="resource-list">' + items.map((item) => {
          const title = item.title || item.name || "Untitled";
          const url = item.url ? '<p><a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' + escapeHtml(item.url) + "</a></p>" : "";
          const bits = [item.type, item.author, item.level, item.cost].filter(Boolean).join(" · ");
          const notes = item.notes ? "<p>" + escapeHtml(item.notes) + "</p>" : "";
          return '<article class="resource"><h3>' + escapeHtml(title) + "</h3>" +
            (bits ? '<p class="meta">' + escapeHtml(bits) + "</p>" : "") + url + notes + "</article>";
        }).join("") + "</div>";
      } catch (err) {
        el.innerHTML = '<p class="error">Could not load resources-index.json via the local server.</p>';
      }
    }

    const views = ["readme", "plan", "category", "index", "docx"];
    const tabs = Array.from(document.querySelectorAll(".tab"));
    function showView(view) {
      tabs.forEach((t) => {
        const on = t.dataset.view === view;
        t.classList.toggle("active", on);
        t.setAttribute("aria-selected", on ? "true" : "false");
        t.tabIndex = on ? 0 : -1;
      });
      views.forEach((v) => {
        document.getElementById("view-" + v).hidden = v !== view;
      });
    }
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => showView(tab.dataset.view));
      tab.addEventListener("keydown", (e) => {
        const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
        if (!keys.includes(e.key)) return;
        e.preventDefault();
        const i = tabs.indexOf(tab);
        let next = i;
        if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
        if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
        if (e.key === "Home") next = 0;
        if (e.key === "End") next = tabs.length - 1;
        tabs[next].focus();
        showView(tabs[next].dataset.view);
      });
    });
    showView("readme");

    loadText("README.md", document.getElementById("readme-body"));
    loadText("quick-start-30-day-plan.md", document.getElementById("plan-body"));
    loadText("resources-by-category.md", document.getElementById("category-body"));
    loadIndex();
  </script>
</body>
</html>
